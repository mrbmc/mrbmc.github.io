<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
  #debugger {display: none;}
</style>

<canvas id="c"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// Color palette from site: purple/indigo, orange, lavender/pink
// Matching the image: deep purple, warm orange, soft lavender
const vertShader = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = vec4(position, 1.0);
  }
`;

const fragShader = `
  #define N 16
  uniform float uTime;
  uniform vec2 uResolution;
  uniform vec2 uAnchors[N];
  uniform vec2 uOrbits[N];
  uniform vec2 uSpeeds[N];
  uniform float uPhases[N];
  varying vec2 vUv;

  vec2 hash2(vec2 p) {
    p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
    return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
  }
  float noise(vec2 p) {
    vec2 i = floor(p); vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(
      mix(dot(hash2(i+vec2(0,0)),f-vec2(0,0)), dot(hash2(i+vec2(1,0)),f-vec2(1,0)), u.x),
      mix(dot(hash2(i+vec2(0,1)),f-vec2(0,1)), dot(hash2(i+vec2(1,1)),f-vec2(1,1)), u.x), u.y);
  }
  float fbm(vec2 p) {
    float v = 0.0; float a = 0.5;
    mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.5));
    for (int i = 0; i < 4; i++) { v += a * noise(p); p = rot * p * 2.0 + vec2(100.0); a *= 0.5; }
    return v;
  }

  void main() {
    float aspect = uResolution.x / uResolution.y;
    vec2 uv = vec2(vUv.x * aspect, vUv.y);
    float t = uTime * 0.08;

    // palette — indigo ~50%, accents ~50%
    vec3 indigo = vec3(0.118, 0.133, 0.663);
    vec3 pink   = vec3(1.00,  0.400, 0.600);
    vec3 teal   = vec3(0.133, 0.478, 0.569);
    vec3 yellow = vec3(0.902, 0.871, 0.000);
    vec3 c[N];
    c[0]=indigo; c[1]=pink;   c[2]=indigo; c[3]=teal;
    c[4]=yellow; c[5]=indigo; c[6]=pink;   c[7]=indigo;
    c[8]=teal;   c[9]=indigo; c[10]=yellow;c[11]=pink;
    c[12]=indigo;c[13]=teal;  c[14]=indigo;c[15]=pink;

    // animated sites
    vec2 sites[N];
    for (int i = 0; i < N; i++) {
      float ph = uPhases[i];
      sites[i] = vec2(
        aspect * (uAnchors[i].x + uOrbits[i].x * sin(t * uSpeeds[i].x + ph)),
                  uAnchors[i].y + uOrbits[i].y * cos(t * uSpeeds[i].y + ph + 1.1)
      );
    }

    // fbm warp — organic shapes
    vec2 wuv = uv;
    wuv.x += fbm(uv * 0.9 + vec2(0.0, t * 0.15)) * 0.55;
    wuv.y += fbm(uv * 0.9 + vec2(4.3, t * 0.15)) * 0.55;

    // Smooth inverse-distance weighted color blend
    // Power 8 = sharper regions with steeper gradients at boundaries
    float totalW = 0.0;
    vec3 colorAcc = vec3(0.0);
    for (int i = 0; i < N; i++) {
      float d = length(wuv - sites[i]);
      float w = pow(1.0 / max(d, 0.001), 8.0);
      totalW += w;
      colorAcc += c[i] * w;
    }
    vec3 col = colorAcc / totalW;

    // Spray grain — finite-difference gradient of color field
    vec2 px = gl_FragCoord.xy;
    float eps = 0.018;
    vec2 wuvDx = wuv + vec2(eps, 0.0);
    vec2 wuvDy = wuv + vec2(0.0, eps);
    vec3 cDx = vec3(0.0); vec3 cDy = vec3(0.0); float wDx = 0.0; float wDy = 0.0;
    for (int i = 0; i < N; i++) {
      float wx = pow(1.0 / max(length(wuvDx - sites[i]), 0.001), 8.0); wDx += wx; cDx += c[i] * wx;
      float wy = pow(1.0 / max(length(wuvDy - sites[i]), 0.001), 8.0); wDy += wy; cDy += c[i] * wy;
    }
    cDx /= wDx; cDy /= wDy;
    float edgeness = clamp((length(cDx - col) + length(cDy - col)) * 4.0, 0.0, 1.0);

    // three octaves of grain at different scales
    float g1 = noise(px / 5.0) * 0.5 + 0.5;
    float g2 = noise(px / 2.5 + vec2(47.0, 93.0)) * 0.5 + 0.5;
    float g3 = noise(px / 1.2 + vec2(131.0, 17.0)) * 0.5 + 0.5;
    float rawGrain = g1 * 0.45 + g2 * 0.35 + g3 * 0.20;

    // grain everywhere, just much denser at edges
    // inside: threshold 0.58 (moderate baseline spray)
    // edge:   threshold 0.28 (very dense)
    float dotted = step(mix(0.58, 0.28, edgeness), rawGrain);

    // dot strength: 0.35 inside cells, full 1.0 at edges
    float strength = mix(0.35, 1.0, edgeness);
    col = mix(col, mix(col, cDx, 0.85), dotted * strength);

    // subtle interior shading
    col *= 0.96 + fbm(uv * 2.5 + t * 0.12) * 0.07;

    col = pow(clamp(col, 0.0, 1.0), vec3(0.95));
    gl_FragColor = vec4(col, 1.0);
  }
`;

const N = 16;
const r = () => Math.random();

// Random anchor positions spread across [0,1] UV space
const anchors  = Array.from({length: N}, () => new THREE.Vector2(r(), r()));
// Random orbit amplitudes [0.08 .. 0.28]
const orbits   = Array.from({length: N}, () => new THREE.Vector2(0.08 + r() * 0.20, 0.08 + r() * 0.20));
// Random orbit speeds [0.35 .. 0.85]
const speeds   = Array.from({length: N}, () => new THREE.Vector2(0.35 + r() * 0.50, 0.35 + r() * 0.50));
// Random phase offsets [0 .. 2π]
const phases   = Array.from({length: N}, () => r() * Math.PI * 2);
const geo = new THREE.PlaneGeometry(2, 2);
const mat = new THREE.ShaderMaterial({
  vertexShader: vertShader,
  fragmentShader: fragShader,
  uniforms: {
    uTime:       { value: 0 },
    uResolution: { value: new THREE.Vector2() },
    uAnchors:    { value: anchors },
    uOrbits:     { value: orbits },
    uSpeeds:     { value: speeds },
    uPhases:     { value: phases },
  },
});
scene.add(new THREE.Mesh(geo, mat));

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h);
  mat.uniforms.uResolution.value.set(w, h);
}
resize();
window.addEventListener('resize', resize);

const clock = new THREE.Clock();
(function animate() {
  requestAnimationFrame(animate);
  mat.uniforms.uTime.value = clock.getElapsedTime();
  renderer.render(scene, camera);
})();
</script>
